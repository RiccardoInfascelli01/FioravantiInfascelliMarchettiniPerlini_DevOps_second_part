name: Deploy to CINECA

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ecdsa
          echo "${{ secrets.SSH_CERT }}" > ~/.ssh/id_ecdsa-cert.pub
          chmod 600 ~/.ssh/id_ecdsa
          chmod 644 ~/.ssh/id_ecdsa-cert.pub

      - name: Deploy container and job script to CINECA
        run: |
          scp -i ~/.ssh/id_ecdsa \
              -o CertificateFile=~/.ssh/id_ecdsa-cert.pub \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              container.sif rinfasce@login.g100.cineca.it:/g100/home/userexternal/rinfasce/

          scp -i ~/.ssh/id_ecdsa \
              -o CertificateFile=~/.ssh/id_ecdsa-cert.pub \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              job.sh rinfasce@login.g100.cineca.it:/g100/home/userexternal/rinfasce/

      - name: Submit SLURM job on CINECA
        run: |
          ssh -i ~/.ssh/id_ecdsa \
              -o CertificateFile=~/.ssh/id_ecdsa-cert.pub \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              rinfasce@login.g100.cineca.it "cd /g100/home/userexternal/rinfasce && sbatch job.sh"
