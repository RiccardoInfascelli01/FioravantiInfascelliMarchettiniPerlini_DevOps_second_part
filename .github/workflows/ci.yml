name: C++ CI with Singularity Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.27'

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Install Singularity dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libseccomp-dev pkg-config squashfs-tools cryptsetup

    - name: Download Singularity installer
      run: |
        export VERSION=3.11.0
        wget https://github.com/sylabs/singularity/releases/download/v${VERSION}/singularity-${VERSION}.tar.gz
        tar -xzf singularity-${VERSION}.tar.gz

    - name: Build and install Singularity
      run: |
        cd singularity-${VERSION}
        ./mconfig
        make -C builddir
        sudo make -C builddir install
      shell: bash

    - name: Check Singularity.def exists
      run: ls -l Singularity.def

    - name: Build Singularity image
      run: |
        sudo singularity build image_converter.sif Singularity.def

    - name: Upload Singularity image as artifact
      uses: actions/upload-artifact@v2
      with:
        name: singularity-image
        path: image_converter.sif
